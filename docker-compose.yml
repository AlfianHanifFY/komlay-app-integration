services:
  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - webshop
      - inventory
      - partner

  webshop:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python webshop.py

  inventory:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python inventory.py

  partner:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python partner.py

  customer-web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./customer:/app:ro
    command: python -m http.server 8080
    ports:
      - "8080:8080"
